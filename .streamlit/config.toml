[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
showWidgetBorder = true
baseRadius = "0.6rem"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
